# 相対的時空間かまどのアイテム名
furnace-name: "§5相対的時空間§7かまど"

# 相対的時空間かまどの説明文
# 既に配布済みのかまども、使用時にこの内容へ更新される
furnace-lore:
  - "§7大量に圧縮されたかまどの重力により発生する§bウラシマ効果§7と"
  - "§dちょっとした技術§7を用いて精錬時間の短縮を実現したかまど。"
  - ""
  - "§aオフハンドにこのかまど、メインハンドに対象のアイテムを持って"
  - "§a右クリックで燃料の供給・精錬ができる。"
  - "§aスニークしながら右クリックでまとめて処理する。"
  - "§7mcMMOの経験値獲得・倍化適用"
  - "§7インベントリに入りきらない分はItemStashに送られる。"
  - ""
  - "§c原木を精錬し切ると空いたスロットに木炭が入り、続けて"
  - "§c燃料にされることがあります。木炭が欲しい場合は"
  - "§cホットバーの原木より左側に1つ以上スペースを空けてください。"
  - ""
  - "§7燃料: §8石炭 木炭 石炭ブロック §6ブレイズロッド §cマグマバケツ"
  - "§7精錬: §fかまどで焼けるアイテム全て"

# 燃料として使えるアイテムと、追加される燃料の量
fuels:
  COAL: 8
  CHARCOAL: 8
  COAL_BLOCK: 80
  LAVA_BUCKET: 100
  BLAZE_ROD: 12

# サーバーに登録されている全てのかまどレシピを精錬対象にするか
use-vanilla-recipes: true

# 精錬時にバニラの経験値（普通のかまどと同じ量）を付与するか
give-vanilla-exp: false

# 精錬対象から除外するアイテム
disabled-smelting: []

# 精錬レシピの個別設定（かまどレシピの上書き・追加）
# 書式:
#   燃やすアイテム:
#     result: 出来上がるアイテム（省略時はかまどレシピの結果）
#     xp: mcMMOの精錬スキルに入る経験値（1個あたり、省略時はバニラのレシピの経験値）
smelting:
  IRON_ORE:
    result: IRON_INGOT
    xp: 25
  GOLD_ORE:
    result: GOLD_INGOT
    xp: 35
  OAK_LOG:
    result: CHARCOAL
    xp: 15
  SPRUCE_LOG:
    result: CHARCOAL
    xp: 15
  BIRCH_LOG:
    result: CHARCOAL
    xp: 15
  JUNGLE_LOG:
    result: CHARCOAL
    xp: 15
  ACACIA_LOG:
    result: CHARCOAL
    xp: 15
  DARK_OAK_LOG:
    result: CHARCOAL
    xp: 15
  STRIPPED_OAK_LOG:
    result: CHARCOAL
    xp: 15
  STRIPPED_SPRUCE_LOG:
    result: CHARCOAL
    xp: 15
  STRIPPED_BIRCH_LOG:
    result: CHARCOAL
    xp: 15
  STRIPPED_JUNGLE_LOG:
    result: CHARCOAL
    xp: 15
  STRIPPED_ACACIA_LOG:
    result: CHARCOAL
    xp: 15
  STRIPPED_DARK_OAK_LOG:
    result: CHARCOAL
    xp: 15
  WET_SPONGE:
    result: SPONGE
    xp: 20